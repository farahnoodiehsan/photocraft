name: Morvarid Windows Build

on:
  push:
    branches: [morvarid/generative-openai]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morvarid-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Build MSI and portable ZIP
        shell: pwsh
        env:
          PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/release/* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/release/SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-morvarid-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
